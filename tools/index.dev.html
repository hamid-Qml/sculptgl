<!doctype html>
<html lang='en'>

<head>
  <meta charset='utf-8' />
  <meta name='description' content='SculptGL is a small sculpting application powered by JavaScript and webGL.'>
  <meta name='author' content='stéphane GINIER'>
  <meta name='mobile-web-app-capable' content='yes'>
  <meta name='apple-mobile-web-app-capable' content='yes'>

  <title> SculptGL - A WebGL sculpting app </title>

  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,600' rel='stylesheet' type='text/css'>
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css' />
  <link rel='stylesheet' href='css/yagui.css' type='text/css' />
  <link rel='stylesheet' href='css/ui.css' type='text/css' />

  <script>
  'use strict';

  window.sketchfabOAuth2Config = {
    hostname: 'sketchfab.com',
    client_id: 'OWoAmrd1QCS9wB54Ly17rMl2i5AHGvDNfmN4pEUH',
    // doesn't work in localhost? (https?)
    redirect_uri: window.location.href + 'authSuccess.html'
  };

  window.addEventListener('load', function () {
    var app = new window.SculptGL();
    app.start();
  });
  </script>
</head>

<body oncontextmenu='return false;'>
  <div id="left-toolbar">
    <div id="left-toolbar-tool-transform" title="Transform" data-tool="TRANSFORM">
      <i class="fas fa-arrows-alt"></i>
    </div>
    <div id="left-toolbar-tool-move" title="Move">
      <i class="fas fa-ruler-combined"></i>
    </div>
    <div id="left-toolbar-tool-rotate" title="Rotate">
      <i class="fas fa-sync-alt"></i>
    </div>
    <div id="left-toolbar-tool-scale" title="Scale">
      <i class="fas fa-expand-arrows-alt"></i>
    </div>
  </div>



  <dialog id="fileDialog">
    <form id="uploadForm">
      <label for="fileInput">Choose an image:</label>
      <input type="file" id="fileInput" accept="image/*" required>
      <div class="loading-container" style="display: none;">
        <div class="loading-spinner"></div>
        <div class="loading-message">Uploading...</div>
      </div>
      <div class="dialog-buttons">
        <button class="gui-button" type="submit">Submit</button>
        <button class="gui-button" type="button" id="closeDialogButton">Cancel</button>
      </div>
    </form>
  </dialog>



  <input type='file' id='fileopen' multiple style='display: none' />
  <input type='file' id='backgroundopen' style='display: none' />
  <input type='file' id='alphaopen' style='display: none' />
  <input type='file' id='textureopen' style='display: none' />
  <input type='file' id='matcapopen' style='display: none' />

  <div id='viewport'>
    <canvas id='canvas'></canvas>
  </div>

  <script src='sculptgl.js'></script>
</body>

</html>
